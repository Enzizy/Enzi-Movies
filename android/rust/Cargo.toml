[package]
name = "streambert-android"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
jni = "0.21.1"
serde_json = "1"
ureq = { version = "2.12.1", default-features = false, features = ["tls"] }
url = "2.5"

[profile.release]
strip = "symbols"
lto = "thin"
